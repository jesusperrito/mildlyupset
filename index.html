<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mildlyupset — content studio</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }

  body {
    background: #ffffff;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    font-family: 'Georgia', serif;
    cursor: none;
  }

  #canvas {
    position: absolute;
    inset: 0;
    touch-action: none;
  }

  #overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 5;
  }

  #est {
    position: absolute;
    top: 44px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    letter-spacing: 0.2em;
    color: #111;
    font-family: 'Georgia', serif;
    white-space: nowrap;
  }

  #serviceplan {
    position: absolute;
    bottom: 44px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    letter-spacing: 0.16em;
    color: #111;
    font-family: 'Georgia', serif;
    white-space: nowrap;
  }

  #logo-wrap {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: min(72vw, 660px);
  }

  #logo-wrap svg {
    width: 100%;
    height: auto;
    display: block;
  }

  /* ── controls ── */
  #ui {
    position: absolute;
    bottom: 36px;
    right: 28px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 10px;
    z-index: 10;
    pointer-events: all;
  }

  #ui-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .size-btn {
    width: 33px;
    height: 33px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border: 1.5px solid #ccc;
    background: #fff;
    color: #666;
    font-size: 11px;
    letter-spacing: 0.04em;
    transition: border-color 0.15s, color 0.15s, background 0.15s;
    font-family: 'Georgia', serif;
  }
  .size-btn:hover  { border-color: #111; color: #111; }
  .size-btn.active { border-color: #111; background: #111; color: #fff; }

  .sep-v { width: 1px; height: 20px; background: #e0e0e0; flex-shrink: 0; }

  .action-btn {
    background: #fff;
    border: 1.5px solid #ccc;
    border-radius: 20px;
    color: #666;
    padding: 6px 14px;
    font-size: 11px;
    cursor: pointer;
    letter-spacing: 0.1em;
    transition: border-color 0.15s, color 0.15s;
    font-family: 'Georgia', serif;
    text-transform: lowercase;
  }
  .action-btn:hover { border-color: #111; color: #111; }

  #color-indicator { display: flex; align-items: center; gap: 6px; }
  .color-pip {
    width: 9px; height: 9px; border-radius: 50%;
    transition: transform 0.18s;
    opacity: 0.35;
  }
  .color-pip.active { transform: scale(1.6); opacity: 1; }

  #hint {
    position: absolute;
    bottom: 44px;
    left: 28px;
    color: #ccc;
    font-size: 11px;
    letter-spacing: 0.13em;
    pointer-events: none;
    font-family: 'Georgia', serif;
  }

  /* custom SVG cursors */
  #cursor-pencil, #cursor-hand, #cursor-grabbing {
    position: fixed;
    pointer-events: none;
    z-index: 100;
    display: none;
  }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
const PALETTE = ['#FF2D8B', '#E8431A', '#2B3FF5'];
let paletteIdx = 0;

function nextColor() {
  const c = PALETTE[paletteIdx % PALETTE.length];
  paletteIdx++;
  updatePips();
  return c;
}
function updatePips() {
  const a = paletteIdx % PALETTE.length;
  PALETTE.forEach((_, i) =>
    document.getElementById('pip-' + i).classList.toggle('active', i === a)
  );
}

const BRUSH_SIZES = { S: 4, M: 8, L: 15 };
let currentSize    = 'S';
let gravityFlipped = false;

/* ── canvas ── */
const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');
let W = 0, H = 0;
const SAFE = 100; // px inset — bodies bounce back if they escape

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  updateBoundaries();
}
window.addEventListener('resize', resize);

/* ── matter.js (soft gravity) ── */
const { Engine, Runner, Bodies, Body, World, Query } = Matter;
const engine = Engine.create({ gravity: { x: 0, y: 0.5 } });
const world  = engine.world;
Runner.run(Runner.create(), engine);

let ground, ceiling, wallL, wallR;

function createBoundaries() {
  const T = 80;
  ground  = Bodies.rectangle(W/2,    H+T/2,  W+200, T, { isStatic:true, friction:0.6,  restitution:0.22 });
  ceiling = Bodies.rectangle(W/2,    -H*3,   W+200, T, { isStatic:true, friction:0.3,  restitution:0.18 });
  wallL   = Bodies.rectangle(-T/2,   H/2,    T, H*4,  { isStatic:true, friction:0.4,  restitution:0.2  });
  wallR   = Bodies.rectangle(W+T/2,  H/2,    T, H*4,  { isStatic:true, friction:0.4,  restitution:0.2  });
  World.add(world, [ground, ceiling, wallL, wallR]);
}

function updateBoundaries() {
  if (!ground) return;
  const T = 80;
  Body.setPosition(ground,  { x: W/2,   y: H+T/2 });
  Body.setPosition(ceiling, { x: W/2,   y: -H*3  });
  Body.setPosition(wallL,   { x: -T/2,  y: H/2   });
  Body.setPosition(wallR,   { x: W+T/2, y: H/2   });
}

resize();
createBoundaries();

/* ── body store ── */
let bodies = [];

/* ── safe-zone clamp (runs every frame) ── */
function clampBodies() {
  bodies.forEach(({ body }) => {
    if (body.isStatic) return;
    const { x, y } = body.position;
    const vx = body.velocity.x, vy = body.velocity.y;
    let nx = vx, ny = vy;
    if (x < SAFE && vx < 0)       nx =  Math.abs(vx) * 0.7;
    if (x > W - SAFE && vx > 0)   nx = -Math.abs(vx) * 0.7;
    if (y > H - SAFE && vy > 0)   ny = -Math.abs(vy) * 0.7;
    // Top: only nudge back if very far above screen (2.5x height above)
    if (y < -H * 2.5 && vy < 0)   ny =  Math.abs(vy) * 0.6;
    if (nx !== vx || ny !== vy) Body.setVelocity(body, { x: nx, y: ny });
  });
}

/* ── periodic random kicks every 5–10 s ── */
function doKick() {
  if (!bodies.length) return;
  const n = Math.max(1, Math.floor(bodies.length * (0.2 + Math.random() * 0.2)));
  [...bodies]
    .sort(() => Math.random() - 0.5)
    .slice(0, n)
    .forEach(({ body }) => {
      if (body.isStatic) return;
      const angle = Math.random() * Math.PI * 2;
      const mag   = 0.0003 + Math.random() * 0.0006; // much weaker
      Body.applyForce(body, body.position, {
        x: Math.cos(angle) * mag * body.mass,
        y: Math.sin(angle) * mag * body.mass
      });
      Body.setAngularVelocity(body, body.angularVelocity + (Math.random() - 0.5) * 0.12);
    });
}
function scheduleKick() {
  setTimeout(() => { doKick(); scheduleKick(); }, 5000 + Math.random() * 5000);
}
scheduleKick();

/* ── pointer ── */
let isDoodling   = false;
let doodlePoints = [];
let strokeColor  = PALETTE[0];
let dragging     = null;
let dragOffset   = { x: 0, y: 0 };
let pointerDown  = false;
let lastPos      = { x: 0, y: 0 };
let velHistory   = [];

/* ── ui events ── */
document.querySelectorAll('.size-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentSize = btn.dataset.size;
  });
});

document.getElementById('clear-btn').addEventListener('click', () => {
  bodies.forEach(b => World.remove(world, b.body));
  bodies = [];
});

document.getElementById('gravity-btn').addEventListener('click', () => {
  gravityFlipped = !gravityFlipped;
  engine.gravity.y = gravityFlipped ? -0.5 : 0.5;
  document.getElementById('gravity-btn').textContent = gravityFlipped ? 'flip gravity ↑' : 'flip gravity';
  bodies.forEach(({ body }) => {
    if (!body.isStatic)
      Body.applyForce(body, body.position, {
        x: (Math.random() - 0.5) * 0.001,
        y: gravityFlipped ? -0.005 : 0.005
      });
  });
});

/* ── custom SVG cursors ── */
const cursorPencil   = document.getElementById('cursor-pencil');
const cursorHand     = document.getElementById('cursor-hand');
const cursorGrabbing = document.getElementById('cursor-grabbing');

let mouseX = 0, mouseY = 0;
let cursorState = 'pencil'; // 'pencil' | 'hand' | 'grabbing'

function showCursor(state) {
  cursorState = state;
  cursorPencil.style.display   = state === 'pencil'   ? 'block' : 'none';
  cursorHand.style.display     = state === 'hand'     ? 'block' : 'none';
  cursorGrabbing.style.display = state === 'grabbing' ? 'block' : 'none';
}
showCursor('pencil');

function placeCursor(x, y, state) {
  // offset so tip of each cursor lands on pointer
  if (state === 'pencil') {
    cursorPencil.style.left = (x - 2) + 'px';
    cursorPencil.style.top  = (y - 22) + 'px';
  } else if (state === 'hand') {
    cursorHand.style.left = (x - 8) + 'px';
    cursorHand.style.top  = (y - 3) + 'px';
  } else {
    cursorGrabbing.style.left = (x - 10) + 'px';
    cursorGrabbing.style.top  = (y - 6) + 'px';
  }
}

document.addEventListener('mousemove', e => {
  mouseX = e.clientX;
  mouseY = e.clientY;
  if (!pointerDown) {
    const r = canvas.getBoundingClientRect();
    const hit = findBody(mouseX - r.left, mouseY - r.top);
    const next = hit ? 'hand' : 'pencil';
    if (next !== cursorState) showCursor(next);
  }
  placeCursor(mouseX, mouseY, cursorState);
});

/* ── helpers ── */
function getPos(e) {
  const r = canvas.getBoundingClientRect();
  const s = e.touches ? e.touches[0] : e;
  return { x: s.clientX - r.left, y: s.clientY - r.top };
}
function findBody(x, y) {
  for (let i = bodies.length - 1; i >= 0; i--)
    if (Query.point([bodies[i].body], { x, y }).length) return bodies[i];
  return null;
}
function pushVel(x, y) {
  velHistory.push({ x, y });
  if (velHistory.length > 8) velHistory.shift();
}
function avgVel() {
  if (!velHistory.length) return { x: 0, y: 0 };
  // weight recent frames more heavily
  let wx = 0, wy = 0, w = 0;
  velHistory.forEach((v, i) => {
    const weight = i + 1;
    wx += v.x * weight; wy += v.y * weight; w += weight;
  });
  return { x: wx / w, y: wy / w };
}

/* ── pointer events ── */
canvas.addEventListener('mousedown',  onDown);
canvas.addEventListener('mousemove',  onMove);
canvas.addEventListener('mouseup',    onUp);
canvas.addEventListener('mouseleave', onUp);
canvas.addEventListener('touchstart', e => { e.preventDefault(); onDown(e); }, { passive: false });
canvas.addEventListener('touchmove',  e => { e.preventDefault(); onMove(e); }, { passive: false });
canvas.addEventListener('touchend',   e => { e.preventDefault(); onUp(e);   }, { passive: false });

function onDown(e) {
  const pos = getPos(e);
  pointerDown = true; velHistory = []; lastPos = { ...pos };
  const hit = findBody(pos.x, pos.y);
  if (hit) {
    dragging   = hit;
    dragOffset = { x: pos.x - hit.body.position.x, y: pos.y - hit.body.position.y };
    Body.setStatic(hit.body, true);
    showCursor('grabbing');
    placeCursor(mouseX, mouseY, 'grabbing');
  } else {
    isDoodling = true; strokeColor = nextColor(); doodlePoints = [pos];
    showCursor('pencil');
    placeCursor(mouseX, mouseY, 'pencil');
  }
}
function onMove(e) {
  if (!pointerDown) return;
  const pos = getPos(e);
  pushVel(pos.x - lastPos.x, pos.y - lastPos.y);
  lastPos = { ...pos };
  if (dragging) {
    Body.setPosition(dragging.body, { x: pos.x - dragOffset.x, y: pos.y - dragOffset.y });
  } else if (isDoodling) {
    const last = doodlePoints[doodlePoints.length - 1];
    if (Math.hypot(pos.x - last.x, pos.y - last.y) > 3) doodlePoints.push(pos);
  }
}
function onUp(e) {
  if (!pointerDown) return;
  const pos = getPos(e);
  pointerDown = false;
  if (dragging) {
    Body.setStatic(dragging.body, false);
    const av = avgVel();
    const speed = Math.hypot(av.x, av.y);
    // Scale: 1px/frame drag → ~1 unit velocity. Cap at 18 so fast flicks don't rocket off.
    const scale = Math.min(speed * 0.55, 18) / Math.max(speed, 0.001);
    Body.setVelocity(dragging.body, { x: av.x * scale, y: av.y * scale });
    dragging = null;
    showCursor('pencil');
    placeCursor(mouseX, mouseY, 'pencil');
  } else if (isDoodling) {
    isDoodling = false;
    doodlePoints.length < 3
      ? spawnDot(pos.x, pos.y, strokeColor, BRUSH_SIZES[currentSize])
      : spawnFromStroke(doodlePoints, strokeColor, BRUSH_SIZES[currentSize]);
    doodlePoints = [];
  }
}

/* ── spawn bodies ── */
const PHYS = { restitution: 0.28, friction: 0.45, frictionAir: 0.022, density: 0.0008 };

function spawnDot(x, y, color, r) {
  const b = Bodies.circle(x, y, r, PHYS);
  World.add(world, b);
  bodies.push({ body: b, color, localPts: [], size: r, isDot: true });
}

function spawnFromStroke(pts, color, brushR) {
  let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
  pts.forEach(p => { minX=Math.min(minX,p.x); minY=Math.min(minY,p.y); maxX=Math.max(maxX,p.x); maxY=Math.max(maxY,p.y); });
  const cx=(minX+maxX)/2, cy=(minY+maxY)/2, pw=maxX-minX, ph=maxY-minY;
  let body;
  if (pw < brushR*3 && ph < brushR*3)
    body = Bodies.circle(cx, cy, Math.max(brushR, (pw+ph)/4), PHYS);
  else if (pw > ph*2.5)
    body = Bodies.rectangle(cx, cy, pw+brushR*2, brushR*1.8, PHYS);
  else if (ph > pw*2.5)
    body = Bodies.rectangle(cx, cy, brushR*1.8, ph+brushR*2, PHYS);
  else
    body = Bodies.circle(cx, cy, Math.max(brushR*1.2, Math.hypot(pw,ph)*0.38), PHYS);

  World.add(world, body);
  bodies.push({ body, color, localPts: pts.map(p => ({ x:p.x-cx, y:p.y-cy })), size: brushR, isDot: false });
}

/* ────────────────────────────────────────────
   INTRO ANIMATION
   A scripted sequence of doodles that draw
   themselves, then drop as physics bodies.
──────────────────────────────────────────── */
let introActive = true;
let introLastTs = null;
let introElapsed = 0;         // total ms since start
let introSpawned = [];        // indices of shapes already spawned as bodies

// Completed intro strokes kept for drawing until bodies take over
let introCompletedStrokes = [];

// Each shape: startMs, endMs (when drawing finishes & body spawns), color, brushR, ptsF (fractions)
function buildTimeline() {
  const shapes = [
    // heart — top left
    { color:'#FF2D8B', brushR:4, ptsF:[
      [0.12,0.22],[0.13,0.20],[0.15,0.185],[0.175,0.175],[0.20,0.175],[0.22,0.185],
      [0.235,0.21],[0.235,0.235],[0.22,0.26],[0.195,0.29],[0.17,0.315],[0.15,0.335],
      [0.13,0.315],[0.105,0.285],[0.10,0.255],[0.105,0.225],[0.12,0.20],[0.14,0.185],
      [0.175,0.175],[0.20,0.185],[0.22,0.21],[0.225,0.24]
    ]},
    // scribble blob — left middle
    { color:'#E8431A', brushR:3, ptsF:[
      [0.07,0.47],[0.10,0.45],[0.13,0.44],[0.15,0.455],[0.145,0.48],
      [0.115,0.505],[0.085,0.495],[0.09,0.465],[0.125,0.45],[0.145,0.47],
      [0.125,0.495],[0.095,0.49],[0.08,0.475]
    ]},
    // smiley face — right of center
    { color:'#FF2D8B', brushR:3, ptsF:(()=>{
      const p=[];
      for(let a=0;a<=Math.PI*2.1;a+=0.2) p.push([0.71+Math.cos(a)*0.052,0.46+Math.sin(a)*0.068]);
      p.push(null,[0.698,0.435],[0.698,0.443],null,[0.722,0.435],[0.722,0.443],
             null,[0.697,0.483],[0.703,0.493],[0.71,0.498],[0.717,0.493],[0.723,0.483]);
      return p;
    })()},
    // zigzag — top right
    { color:'#2B3FF5', brushR:3, ptsF:[
      [0.77,0.14],[0.80,0.17],[0.83,0.13],[0.86,0.17],[0.89,0.13],[0.92,0.17]
    ]},
    // spiral — bottom right
    { color:'#2B3FF5', brushR:3, ptsF:(()=>{
      const p=[];
      for(let a=0,r=0.008;a<Math.PI*4.5;a+=0.25,r+=0.005)
        p.push([0.85+Math.cos(a)*r, 0.73+Math.sin(a)*r]);
      return p;
    })()},
    // wobbly oval — bottom left
    { color:'#E8431A', brushR:4, ptsF:(()=>{
      const p=[];
      for(let a=0;a<=Math.PI*2.1;a+=0.22){
        const w=1+Math.sin(a*2.5)*0.1;
        p.push([0.13+Math.cos(a)*0.065*w, 0.77+Math.sin(a)*0.085*w]);
      }
      return p;
    })()},
  ];

  // lay out on a timeline: each shape draws for ~700-1000ms, 200ms gap between
  const DRAW_DUR = [900, 700, 1100, 600, 850, 900];
  const GAP = 220;
  let cursor = 400; // initial delay before first stroke
  return shapes.map((s, i) => {
    const start = cursor;
    const end   = cursor + DRAW_DUR[i];
    cursor = end + GAP;
    return { ...s, startMs: start, endMs: end, totalMs: cursor };
  });
}

const INTRO_TL = buildTimeline();
const INTRO_TOTAL_MS = INTRO_TL[INTRO_TL.length - 1].endMs + 300;

function tickIntro(dt) {
  introElapsed += dt;

  INTRO_TL.forEach((shape, idx) => {
    if (introElapsed < shape.startMs) return;             // not started
    if (introSpawned.includes(idx)) return;               // already spawned

    if (introElapsed >= shape.endMs) {
      // Spawn physics body now
      const realPts = shape.ptsF
        .filter(p => p !== null)
        .map(p => ({ x: p[0] * W, y: p[1] * H }));
      if (realPts.length >= 2) spawnFromStroke(realPts, shape.color, shape.brushR);
      else if (realPts.length === 1) spawnDot(realPts[0].x, realPts[0].y, shape.color, shape.brushR);
      introSpawned.push(idx);
    }
  });

  if (introElapsed >= INTRO_TOTAL_MS) introActive = false;
}

function drawIntroStrokes() {
  INTRO_TL.forEach((shape, idx) => {
    if (introElapsed < shape.startMs) return;
    if (introSpawned.includes(idx)) return; // body handles rendering now

    const frac = Math.min((introElapsed - shape.startMs) / (shape.endMs - shape.startMs), 1);
    const allPts = shape.ptsF.map(p => p === null ? null : [p[0]*W, p[1]*H]);
    const revealCount = Math.round(frac * allPts.length);
    const pts = allPts.slice(0, Math.max(revealCount, 2));

    if (pts.filter(p=>p!==null).length < 1) return;

    ctx.save();
    ctx.strokeStyle = shape.color;
    ctx.lineWidth   = shape.brushR * 0.85;
    ctx.lineCap     = 'round';
    ctx.lineJoin    = 'round';
    ctx.globalAlpha = 0.92;

    let started = false;
    pts.forEach((p, i) => {
      if (p === null) { if (started) { ctx.stroke(); } started = false; return; }
      if (!started) { ctx.beginPath(); ctx.moveTo(p[0], p[1]); started = true; return; }
      const nx = pts[i+1], isLast = !nx || nx === null;
      if (!isLast && nx !== null) {
        const mx = (p[0]+nx[0])/2, my = (p[1]+nx[1])/2;
        ctx.quadraticCurveTo(p[0], p[1], mx, my);
      } else {
        ctx.lineTo(p[0], p[1]);
      }
    });
    if (started) ctx.stroke();
    ctx.restore();
  });
}

/* ── main loop ── */
function drawBody(b) {
  const { body, color, localPts, size, isDot } = b;
  const { x, y } = body.position;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(body.angle);

  if (isDot || !localPts.length) {
    ctx.beginPath();
    ctx.arc(0, 0, size, 0, Math.PI*2);
    ctx.fillStyle = color;
    ctx.fill();
  } else {
    ctx.strokeStyle = color;
    ctx.lineWidth   = size * 0.85;
    ctx.lineCap     = 'round';
    ctx.lineJoin    = 'round';
    ctx.beginPath();
    ctx.moveTo(localPts[0].x, localPts[0].y);
    for (let i = 1; i < localPts.length-1; i++) {
      const mx = (localPts[i].x + localPts[i+1].x)/2;
      const my = (localPts[i].y + localPts[i+1].y)/2;
      ctx.quadraticCurveTo(localPts[i].x, localPts[i].y, mx, my);
    }
    ctx.lineTo(localPts[localPts.length-1].x, localPts[localPts.length-1].y);
    ctx.stroke();
  }
  ctx.restore();
}

function drawPreview() {
  if (!isDoodling || doodlePoints.length < 2) return;
  const pts = doodlePoints;
  ctx.save();
  ctx.strokeStyle = strokeColor;
  ctx.lineWidth   = BRUSH_SIZES[currentSize] * 0.85;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.globalAlpha = 0.88;
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length-1; i++) {
    const mx=(pts[i].x+pts[i+1].x)/2, my=(pts[i].y+pts[i+1].y)/2;
    ctx.quadraticCurveTo(pts[i].x, pts[i].y, mx, my);
  }
  ctx.lineTo(pts[pts.length-1].x, pts[pts.length-1].y);
  ctx.stroke();
  ctx.restore();
}

function drawDragRing() {
  if (!dragging) return;
  const { x, y } = dragging.body.position;
  ctx.save();
  ctx.strokeStyle = dragging.color;
  ctx.lineWidth   = 1;
  ctx.globalAlpha = 0.25;
  ctx.setLineDash([4, 6]);
  ctx.beginPath();
  ctx.arc(x, y, (dragging.size || 14) + 14, 0, Math.PI*2);
  ctx.stroke();
  ctx.restore();
}

function loop(ts) {
  requestAnimationFrame(loop);
  const dt = introLastTs === null ? 16 : Math.min(ts - introLastTs, 50);
  introLastTs = ts;

  if (introActive) tickIntro(dt);

  clampBodies();
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, H);
  bodies.forEach(drawBody);
  if (introActive) drawIntroStrokes();
  drawPreview();
  drawDragRing();
}

requestAnimationFrame(loop);
</script>
</body>
</html>
