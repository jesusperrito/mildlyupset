<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mildlyupset — content studio</title>
<link href="https://fonts.googleapis.com/css2?family=Tiny5&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }

  body {
    background: #ffffff;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    font-family: 'Georgia', serif;
    cursor: none;
  }

  #canvas {
    position: absolute;
    inset: 0;
    touch-action: none;
  }

  #overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 5;
  }

  #est {
    position: absolute;
    top: 44px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    letter-spacing: 0.2em;
    color: #111;
    font-family: 'Georgia', serif;
    white-space: nowrap;
  }

  #serviceplan {
    position: absolute;
    bottom: 44px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    letter-spacing: 0.16em;
    color: #111;
    font-family: 'Georgia', serif;
    white-space: nowrap;
  }

  #logo-wrap {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: min(72vw, 660px);
  }

  #logo-wrap svg {
    width: 100%;
    height: auto;
    display: block;
  }

  /* ── controls ── */
  #ui {
    position: absolute;
    bottom: 36px;
    right: 28px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 10px;
    z-index: 10;
    pointer-events: all;
  }

  #ui-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* size buttons removed — L is now the only drawing weight */

  .action-btn {
    background: #fff;
    border: 1.5px solid #ccc;
    border-radius: 20px;
    color: #666;
    padding: 6px 14px;
    font-size: 11px;
    cursor: pointer;
    letter-spacing: 0.12em;
    transition: border-color 0.15s, color 0.15s;
    font-family: 'Andale Mono', 'Courier New', monospace;
    text-transformrm: lowercase;
  }
  .action-btn:hover { border-color: #111; color: #111; }

  #color-indicator { display: flex; align-items: center; gap: 6px; }
  .color-pip {
    width: 9px; height: 9px; border-radius: 50%;
    transition: transform 0.18s;
    opacity: 0.35;
  }
  .color-pip.active { transform: scale(1.6); opacity: 1; }

  #hint {
    position: absolute;
    bottom: 44px;
    left: 28px;
    color: #ccc;
    font-size: 11px;
    letter-spacing: 0.13em;
    pointer-events: none;
    font-family: 'Georgia', serif;
  }

  /* custom SVG cursors */
  #cursor-pencil, #cursor-hand, #cursor-grabbing {
    position: fixed;
    pointer-events: none;
    z-index: 100;
    display: none;
  }

  /* ── folder overlay ── */
  .folder-overlay {
    position: fixed;
    z-index: 9999;
    left: 0;
    top: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 11px;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    cursor: grab;
  }
  .folder-overlay:active { cursor: grabbing; }
  .folder-overlay, .folder-overlay * { -webkit-user-drag: none; user-drag: none; }
  .folder-label {
    font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 0.02em;
    color: #ffffff;
    text-align: center;
    white-space: nowrap;
    pointer-events: none;
    text-shadow:
      0 0 3px rgba(0,0,0,0.55),
      0 0 6px rgba(0,0,0,0.35),
      0 3px 8px rgba(0,0,0,0.32),
      0 5px 12px rgba(0,0,0,0.18);
  }

/* ── portfolio view ── */
  #portfolio {
    position: fixed;
    inset: 0;
    background: #0a0a0a;
    z-index: 50;
    display: none;
    overflow: hidden;
    cursor: auto;
  }
  #portfolio.open {
    display: block;
    animation: port-in 0.28s ease;
  }
  @keyframes port-in {
    from { opacity: 0; transform: scale(0.975); }
    to   { opacity: 1; transform: scale(1); }
  }

  #port-wordmark {
    position: absolute;
    top: 34px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Tiny5', 'Courier New', monospace;
    font-size: 17px;
    letter-spacing: 0.06em;
    color: rgba(255,255,255,0.18);
    white-space: nowrap;
    pointer-events: none;
    z-index: 1;
  }
  #port-section {
    position: absolute;
    top: 62px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Andale Mono', 'Courier New', monospace;
    font-size: 9px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.12);
    pointer-events: none;
  }
  #port-back {
    position: absolute;
    bottom: 32px;
    left: 32px;
    font-family: 'Andale Mono', 'Courier New', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    color: rgba(255,255,255,0.3);
    cursor: pointer;
    z-index: 10;
    transition: color 0.15s;
    user-select: none;
  }
  #port-back:hover { color: rgba(255,255,255,0.75); }
  #port-hint {
    position: absolute;
    bottom: 32px;
    right: 32px;
    font-family: 'Andale Mono', 'Courier New', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    color: rgba(255,255,255,0.15);
    pointer-events: none;
  }

  /* ── video cards ── */
  .vid-card {
    position: absolute;
    width: 190px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    cursor: grab;
    user-select: none;
  }
  .vid-card:active { cursor: grabbing; }
  .vid-card.selected .card-icon { box-shadow: 0 0 0 2px rgba(255,255,255,0.45); }

  .card-icon {
    width: 180px;
    height: 200px;
    border-radius: 4px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
    box-shadow: 0 8px 32px rgba(0,0,0,0.6);
  }
  .card-header {
    height: 32px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card-body {
    flex: 1;
    background: rgba(255,255,255,0.05);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* dog-ear fold */
  .card-icon::after {
    content: '';
    position: absolute;
    top: 0; right: 0;
    width: 0; height: 0;
    border-style: solid;
    border-width: 0 13px 13px 0;
    border-color: #0a0a0a #0a0a0a transparent transparent;
  }
  .play-tri {
    width: 0; height: 0;
    border-style: solid;
    border-width: 9px 0 9px 15px;
    border-color: transparent transparent transparent rgba(255,255,255,0.4);
    margin-left: 3px;
  }
  .card-filename {
    font-family: 'Andale Mono', 'Courier New', monospace;
    font-size: 10px;
    letter-spacing: 0.03em;
    color: rgba(255,255,255,0.5);
    text-align: center;
    width: 186px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    pointer-events: none;
  }
  .card-placeholder {
    font-family: 'Andale Mono', 'Courier New', monospace;
    font-size: 8px;
    letter-spacing: 0.06em;
    color: rgba(255,255,255,0.15);
    text-align: center;
    padding: 0 8px;
    pointer-events: none;
  }

  /* ── video thumbnails in cards ── */
function loadCardThumbs() {
  document.querySelectorAll('.card-thumb').forEach(v => {
    v.addEventListener('loadedmetadata', () => { v.currentTime = 0.5; });
    if (v.getAttribute('src')) v.load();
  });
}
loadCardThumbs();

/* ── lightbox ── */
  #lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.93);
    z-index: 200;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 14px;
  }
  #lightbox.open { display: flex; }
  #lightbox video {
    max-width: 86vw;
    max-height: 78vh;
    outline: none;
    border-radius: 2px;
    display: block;
  }
  #lightbox-placeholder {
    width: min(540px, 80vw);
    height: min(304px, 55vw);
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    display: none;
  }
  #lightbox-placeholder .ph-icon {
    opacity: 0.3;
  }
  #lightbox-placeholder p {
    font-family: 'Andale Mono', 'Courier New', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: rgba(255,255,255,0.3);
  }
  #lightbox-close {
    position: absolute;
    top: 24px; right: 28px;
    font-family: 'Andale Mono', 'Courier New', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: rgba(255,255,255,0.4);
    cursor: pointer;
    transition: color 0.15s;
    user-select: none;
  }
  #lightbox-close:hover { color: #fff; }
  #lightbox-filename {
    font-family: 'Andale Mono', 'Courier New', monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    color: rgba(255,255,255,0.25);
  }

</style>
</head>

  ground  = Bodies.rectangle(W/2,    H+T/2,  W+200, T, { isStatic:true, friction:0.6,  restitution:0.22 });
  ceiling = Bodies.rectangle(W/2,    -H*3,   W+200, T, { isStatic:true, friction:0.3,  restitution:0.18 });
  wallL   = Bodies.rectangle(-T/2,   H/2,    T, H*4,  { isStatic:true, friction:0.4,  restitution:0.2  });
  wallR   = Bodies.rectangle(W+T/2,  H/2,    T, H*4,  { isStatic:true, friction:0.4,  restitution:0.2  });
  World.add(world, [ground, ceiling, wallL, wallR]);
}

function updateBoundaries() {
  if (!ground) return;
  const T = 80;
  Body.setPosition(ground,  { x: W/2,   y: H+T/2 });
  Body.setPosition(ceiling, { x: W/2,   y: -H*3  });
  Body.setPosition(wallL,   { x: -T/2,  y: H/2   });
  Body.setPosition(wallR,   { x: W+T/2, y: H/2   });
}

resize();
createBoundaries();

/* ── body store ── */
let bodies = [];

/* ── safe-zone clamp (runs every frame) ── */
function clampBodies() {
  bodies.forEach(({ body }) => {
    if (body.isStatic) return;
    const { x, y } = body.position;
    const vx = body.velocity.x, vy = body.velocity.y;
    let nx = vx, ny = vy;
    if (x < SAFE && vx < 0)       nx =  Math.abs(vx) * 0.7;
    if (x > W - SAFE && vx > 0)   nx = -Math.abs(vx) * 0.7;
    if (y > H - SAFE && vy > 0)   ny = -Math.abs(vy) * 0.7;
    // Top: only nudge back if very far above screen (2.5x height above)
    if (y < -H * 2.5 && vy < 0)   ny =  Math.abs(vy) * 0.6;
    if (nx !== vx || ny !== vy) Body.setVelocity(body, { x: nx, y: ny });
  });
}

/* ── periodic random kicks every 5–10 s ── */
function doKick() {
  if (!bodies.length) return;
  const n = Math.max(1, Math.floor(bodies.length * (0.2 + Math.random() * 0.2)));
  [...bodies]
    .sort(() => Math.random() - 0.5)
    .slice(0, n)
    .forEach(({ body }) => {
      if (body.isStatic) return;
      const angle = Math.random() * Math.PI * 2;
      const mag   = 0.0003 + Math.random() * 0.0006; // much weaker
      Body.applyForce(body, body.position, {
        x: Math.cos(angle) * mag * body.mass,
        y: Math.sin(angle) * mag * body.mass
      });
      Body.setAngularVelocity(body, body.angularVelocity + (Math.random() - 0.5) * 0.12);
    });
}
function scheduleKick() {
  setTimeout(() => { doKick(); scheduleKick(); }, 5000 + Math.random() * 5000);
}
scheduleKick();

/* ── pointer ── */
let isDoodling   = false;
let doodlePoints = [];
let strokeColor  = PALETTE[0];
let dragging     = null;
let dragOffset   = { x: 0, y: 0 };
let pointerDown  = false;
let lastPos      = { x: 0, y: 0 };
let velHistory   = [];

/* ── ui events ── */
document.getElementById('clear-btn').addEventListener('click', () => {

/* ── custom SVG cursors ── */
const cursorPencil   = document.getElementById('cursor-pencil');
const cursorHand     = document.getElementById('cursor-hand');
const cursorGrabbing = document.getElementById('cursor-grabbing');

let mouseX = 0, mouseY = 0;
let cursorState = 'pencil'; // 'pencil' | 'hand' | 'grabbing'

function showCursor(state) {
  cursorState = state;
  cursorPencil.style.display   = state === 'pencil'   ? 'block' : 'none';
  cursorHand.style.display     = state === 'hand'     ? 'block' : 'none';
  cursorGrabbing.style.display = state === 'grabbing' ? 'block' : 'none';
}
showCursor('pencil');

function placeCursor(x, y, state) {
  // offset so tip of each cursor lands on pointer
  if (state === 'pencil') {
    cursorPencil.style.left = (x - 2) + 'px';
    cursorPencil.style.top  = (y - 22) + 'px';
  } else if (state === 'hand') {
    cursorHand.style.left = (x - 8) + 'px';
    cursorHand.style.top  = (y - 3) + 'px';
  } else {
    cursorGrabbing.style.left = (x - 10) + 'px';
    cursorGrabbing.style.top  = (y - 6) + 'px';
  }
}

document.addEventListener('mousemove', e => {
  mouseX = e.clientX;
  mouseY = e.clientY;
  if (portfolioOpen) return;
  if (!pointerDown) {
    const r = canvas.getBoundingClientRect();
    const hit = findBody(mouseX - r.left, mouseY - r.top);
    const next = hit ? 'hand' : 'pencil';
    if (next !== cursorState) showCursor(next);
  }
  placeCursor(mouseX, mouseY, cursorState);
});

/* ── helpers ── */
function getPos(e) {
  const r = canvas.getBoundingClientRect();
  const s = e.touches ? e.touches[0] : e;
  return { x: s.clientX - r.left, y: s.clientY - r.top };
}
function findBody(x, y) {
  for (let i = bodies.length - 1; i >= 0; i--)
    if (Query.point([bodies[i].body], { x, y }).length) return bodies[i];
  return null;
}
function pushVel(x, y) {
  velHistory.push({ x, y });
  if (velHistory.length > 8) velHistory.shift();
}
function avgVel() {
  if (!velHistory.length) return { x: 0, y: 0 };
  // weight recent frames more heavily
  let wx = 0, wy = 0, w = 0;
  velHistory.forEach((v, i) => {
    const weight = i + 1;
    wx += v.x * weight; wy += v.y * weight; w += weight;
  });
  return { x: wx / w, y: wy / w };
}

/* ── pointer events ── */
canvas.addEventListener('mousedown',  onDown);
canvas.addEventListener('mousemove',  onMove);
canvas.addEventListener('mouseup',    onUp);
canvas.addEventListener('mouseleave', onUp);
canvas.addEventListener('touchstart', e => { e.preventDefault(); onDown(e); }, { passive: false });
canvas.addEventListener('touchmove',  e => { e.preventDefault(); onMove(e); }, { passive: false });
canvas.addEventListener('touchend',   e => { e.preventDefault(); onUp(e);   }, { passive: false });

function onDown(e) {
  const pos = getPos(e);
  pointerDown = true; velHistory = []; lastPos = { ...pos };
  const hit = findBody(pos.x, pos.y);
  if (hit) {
    dragging   = hit;
    dragOffset = { x: pos.x - hit.body.position.x, y: pos.y - hit.body.position.y };
    Body.setStatic(hit.body, true);
    showCursor('grabbing');
    placeCursor(mouseX, mouseY, 'grabbing');
  } else {
    isDoodling = true; strokeColor = nextColor(); doodlePoints = [pos];
    showCursor('pencil');
    placeCursor(mouseX, mouseY, 'pencil');
  }
}
function onMove(e) {
  if (!pointerDown) return;
  const pos = getPos(e);
  pushVel(pos.x - lastPos.x, pos.y - lastPos.y);
  lastPos = { ...pos };
  if (dragging) {
    Body.setPosition(dragging.body, { x: pos.x - dragOffset.x, y: pos.y - dragOffset.y });
  } else if (isDoodling) {
    const last = doodlePoints[doodlePoints.length - 1];
    if (Math.hypot(pos.x - last.x, pos.y - last.y) > 3) doodlePoints.push(pos);
  }
}
function onUp(e) {
  if (!pointerDown) return;
  const pos = getPos(e);
  pointerDown = false;
  if (dragging) {
    Body.setStatic(dragging.body, false);
    const av = avgVel();
    const speed = Math.hypot(av.x, av.y);
    // Scale: 1px/frame drag → ~1 unit velocity. Cap at 18 so fast flicks don't rocket off.
    const scale = Math.min(speed * 0.55, 18) / Math.max(speed, 0.001);
    Body.setVelocity(dragging.body, { x: av.x * scale, y: av.y * scale });
    dragging = null;
    showCursor('pencil');
    placeCursor(mouseX, mouseY, 'pencil');
  } else if (isDoodling) {
    isDoodling = false;
    doodlePoints.length < 3
      ? spawnDot(pos.x, pos.y, strokeColor, BRUSH_SIZES[currentSize])
      : spawnFromStroke(doodlePoints, strokeColor, BRUSH_SIZES[currentSize]);
    doodlePoints = [];
  }
}

/* ── spawn bodies ── */
const PHYS = { restitution: 0.28, friction: 0.45, frictionAir: 0.022, density: 0.0008 };

function spawnDot(x, y, color, r) {
  const b = Bodies.circle(x, y, r, PHYS);
  World.add(world, b);
  bodies.push({ body: b, color, localPts: [], size: r, isDot: true });
}

function spawnFromStroke(pts, color, brushR) {
  let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
  pts.forEach(p => { minX=Math.min(minX,p.x); minY=Math.min(minY,p.y); maxX=Math.max(maxX,p.x); maxY=Math.max(maxY,p.y); });
  const cx=(minX+maxX)/2, cy=(minY+maxY)/2, pw=maxX-minX, ph=maxY-minY;
  let body;
  if (pw < brushR*3 && ph < brushR*3)
    body = Bodies.circle(cx, cy, Math.max(brushR, (pw+ph)/4), PHYS);
  else if (pw > ph*2.5)
    body = Bodies.rectangle(cx, cy, pw+brushR*2, brushR*1.8, PHYS);
  else if (ph > pw*2.5)
    body = Bodies.rectangle(cx, cy, brushR*1.8, ph+brushR*2, PHYS);
  else
    body = Bodies.circle(cx, cy, Math.max(brushR*1.2, Math.hypot(pw,ph)*0.38), PHYS);

  World.add(world, body);
  bodies.push({ body, color, localPts: pts.map(p => ({ x:p.x-cx, y:p.y-cy })), size: brushR, isDot: false });
}

/* ────────────────────────────────────────────
   INTRO ANIMATION — flowers
   Single-line daisy drawings that animate in
   then drop as physics bodies.
──────────────────────────────────────────── */
let introActive  = true;
let introLastTs  = null;
let introElapsed = 0;
let introSpawned = [];

/* ── organic doodle generators (L size throughout) ── */
function jitter(v, amt) { return v + (Math.random() - 0.5) * amt; }

// Simple wobbly circle (used for both flower centres and standalone blob circles)
function looseCirle(cx, cy, r, wob, steps) {
  steps = steps || 14;
  const pts = [];
  for (let i = 0; i <= steps; i++) {
    const a = (i / steps) * Math.PI * 2;
    pts.push({ x: jitter(cx + r*Math.cos(a), wob), y: jitter(cy + r*Math.sin(a), wob) });
  }
  return pts;
}

// One petal: circle centred at dist from flower centre in direction angle.
// Approach from flower centre, trace the petal loop, return.
function organicPetal(cx, cy, dist, r, angle, wob) {
  const pcx = cx + dist * Math.cos(angle);
  const pcy = cy + dist * Math.sin(angle);
  const pts = [];
  pts.push({ x: jitter(cx, wob*0.3), y: jitter(cy, wob*0.3) });
  const startA = angle + Math.PI;
  for (let i = 0; i <= 13; i++) {
    const a = startA + (i / 13) * Math.PI * 2;
    pts.push({ x: jitter(pcx + r*Math.cos(a), wob), y: jitter(pcy + r*Math.sin(a), wob) });
  }
  pts.push({ x: jitter(cx, wob*0.3), y: jitter(cy, wob*0.3) });
  return pts;
}

// Full flower: centre circle first, then petals, then optional stem drawn last.
function organicFlower(cx, cy, dist, petalR, centerR, numPetals, wob) {
  let pts = looseCirle(cx, cy, centerR, wob*0.5, 12); // centre first
  for (let i = 0; i < numPetals; i++) {
    const angle = -Math.PI/2 + (i / numPetals) * Math.PI * 2;
    pts = pts.concat(organicPetal(cx, cy, dist, petalR, angle, wob));
  }
  return pts;
}

// Wavy downward stem drawn from flower centre outward
function organicStem(cx, cy, length, wob) {
  const pts = [];
  for (let i = 0; i <= 11; i++) {
    const t = i / 11;
    pts.push({ x: jitter(cx + Math.sin(t * Math.PI * 2) * 7, wob), y: cy + length * t });
  }
  return pts;
}

// Loose wavy horizontal-ish line
function wavyLine(x1, y1, x2, y2, wob) {
  const pts = [];
  const steps = 16;
  const dx = x2-x1, dy = y2-y1, len = Math.hypot(dx, dy);
  const nx = -dy/len, ny = dx/len;
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const wave = Math.sin(t * Math.PI * 2.5) * 18;
    pts.push({ x: jitter(x1 + dx*t + nx*wave, wob), y: jitter(y1 + dy*t + ny*wave, wob) });
  }
  return pts;
}

/* ── timeline: 6 organic doodles, all at L size ── */
function buildTimeline() {
  const L = 15; // match L brush size

  const shapes = [
    // 1. Orange flower + stem — bottom left
    { color:'#E8431A', brushR:L,
      pts: [ ...organicFlower(0.13*W, 0.73*H, 33, 17, 10, 5, 2.5),
             ...organicStem(0.13*W, 0.73*H, H*0.13, 2) ] },

    // 2. Pink flower — top right, no stem
    { color:'#FF2D8B', brushR:L,
      pts: organicFlower(0.83*W, 0.21*H, 30, 16, 9, 5, 2.5) },

    // 3. Pink large flower + tall stem — centre right
    { color:'#FF2D8B', brushR:L,
      pts: [ ...organicFlower(0.70*W, 0.38*H, 40, 21, 12, 6, 3),
             ...organicStem(0.70*W, 0.38*H, H*0.24, 3) ] },

    // 4. Blue standalone circle — top-left area
    { color:'#2B3FF5', brushR:L,
      pts: looseCirle(0.08*W, 0.19*H, 24, 2.5, 14) },

    // 5. Orange standalone circle — bottom right
    { color:'#E8431A', brushR:L,
      pts: looseCirle(0.89*W, 0.74*H, 20, 2, 12) },

  ];

  const DRAW_DUR = [1000, 820, 1100, 480, 420];
  const GAP      = 180;
  let cursor      = 350;
  return shapes.map((s, i) => {
    const start = cursor;
    const end   = cursor + DRAW_DUR[i];
    cursor = end + GAP;
    return { ...s, startMs: start, endMs: end };
  });
}

const INTRO_TL      = buildTimeline();
const INTRO_TOTAL_MS = INTRO_TL[INTRO_TL.length - 1].endMs + 300;

function tickIntro(dt) {
  introElapsed += dt;

  INTRO_TL.forEach((shape, idx) => {
    if (introElapsed < shape.startMs) return;
    if (introSpawned.includes(idx))   return;

    if (introElapsed >= shape.endMs) {
      const realPts = shape.pts.filter(p => p !== null);
      if (realPts.length >= 2) spawnFromStroke(realPts, shape.color, shape.brushR);
      else if (realPts.length === 1) spawnDot(realPts[0].x, realPts[0].y, shape.color, shape.brushR);
      introSpawned.push(idx);
    }
  });

  if (introElapsed >= INTRO_TOTAL_MS) introActive = false;
}

function drawIntroStrokes() {
  INTRO_TL.forEach((shape, idx) => {
    if (introElapsed < shape.startMs) return;
    if (introSpawned.includes(idx))   return;

    const frac        = Math.min((introElapsed - shape.startMs) / (shape.endMs - shape.startMs), 1);
    const revealCount = Math.round(frac * shape.pts.length);
    const pts         = shape.pts.slice(0, Math.max(revealCount, 2));

    if (pts.length < 2) return;

    ctx.save();
    ctx.strokeStyle = shape.color;
    ctx.lineWidth   = shape.brushR * 0.85;
    ctx.lineCap     = 'round';
    ctx.lineJoin    = 'round';
    ctx.globalAlpha = 0.92;

    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length - 1; i++) {
      const mx = (pts[i].x + pts[i+1].x) / 2;
      const my = (pts[i].y + pts[i+1].y) / 2;
      ctx.quadraticCurveTo(pts[i].x, pts[i].y, mx, my);
    }
    ctx.lineTo(pts[pts.length-1].x, pts[pts.length-1].y);
    ctx.stroke();
    ctx.restore();
  });
}

/* ── main loop ── */
function drawBody(b) {
  const { body, color, localPts, size, isDot } = b;
  const { x, y } = body.position;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(body.angle);

  if (isDot || !localPts.length) {
    ctx.beginPath();
    ctx.arc(0, 0, size, 0, Math.PI*2);
    ctx.fillStyle = color;
    ctx.fill();
  } else {
    ctx.strokeStyle = color;
    ctx.lineWidth   = size * 0.85;
    ctx.lineCap     = 'round';
    ctx.lineJoin    = 'round';
    ctx.beginPath();
    ctx.moveTo(localPts[0].x, localPts[0].y);
    for (let i = 1; i < localPts.length-1; i++) {
      const mx = (localPts[i].x + localPts[i+1].x)/2;
      const my = (localPts[i].y + localPts[i+1].y)/2;
      ctx.quadraticCurveTo(localPts[i].x, localPts[i].y, mx, my);
    }
    ctx.lineTo(localPts[localPts.length-1].x, localPts[localPts.length-1].y);
    ctx.stroke();
  }
  ctx.restore();
}

function drawPreview() {
  if (!isDoodling || doodlePoints.length < 2) return;
  const pts = doodlePoints;
  ctx.save();
  ctx.strokeStyle = strokeColor;
  ctx.lineWidth   = BRUSH_SIZES[currentSize] * 0.85;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.globalAlpha = 0.88;
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length-1; i++) {
    const mx=(pts[i].x+pts[i+1].x)/2, my=(pts[i].y+pts[i+1].y)/2;
    ctx.quadraticCurveTo(pts[i].x, pts[i].y, mx, my);
  }
  ctx.lineTo(pts[pts.length-1].x, pts[pts.length-1].y);
  ctx.stroke();
  ctx.restore();
}

function drawDragRing() {
  if (!dragging) return;
  const { x, y } = dragging.body.position;
  ctx.save();
  ctx.strokeStyle = dragging.color;
  ctx.lineWidth   = 1;
  ctx.globalAlpha = 0.25;
  ctx.setLineDash([4, 6]);
  ctx.beginPath();
  ctx.arc(x, y, (dragging.size || 14) + 14, 0, Math.PI*2);
  ctx.stroke();
  ctx.restore();
}

function loop(ts) {
  requestAnimationFrame(loop);
  const dt = introLastTs === null ? 16 : Math.min(ts - introLastTs, 50);
  introLastTs = ts;
  if (introActive) tickIntro(dt);
  clampBodies();
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, H);
  bodies.forEach(drawBody);
  if (introActive) drawIntroStrokes();
  drawPreview();
  drawDragRing();
}

document.addEventListener('mousemove', e => {
  if (!cardDragging) return;
  const port = portfolioEl.getBoundingClientRect();
  let x = e.clientX - port.left - cardDragOx;
  let y = e.clientY - port.top  - cardDragOy;
  x = Math.max(0, Math.min(x, port.width  - cardDragging.offsetWidth));
  y = Math.max(0, Math.min(y, port.height - cardDragging.offsetHeight));
  cardDragging.style.left   = x + 'px';
  cardDragging.style.top    = y + 'px';
  cardDragging.style.transform = 'rotate(0deg)';
});

document.addEventListener('mouseup', () => {
  if (cardDragging) {
    cardDragging.style.cursor = 'grab';
    cardDragging = null;
  }
});

/* ── video thumbnails in cards ── */
function loadCardThumbs() {
  document.querySelectorAll('.card-thumb').forEach(v => {
    v.addEventListener('loadedmetadata', () => { v.currentTime = 0.5; });
    if (v.getAttribute('src')) v.load();
  });
}
loadCardThumbs();

/* ── lightbox ── */
const lightboxEl   = document.getElementById('lightbox');
const lightboxVid  = document.getElementById('lightbox-video');
const lightboxPh   = document.getElementById('lightbox-placeholder');
const lightboxName = document.getElementById('lightbox-filename');

function openLightbox(card) {
  const src   = card.dataset.src  || '';
  const title = card.dataset.title || '';
  lightboxName.textContent = title;

  if (src) {
    lightboxVid.src = src;
    lightboxVid.style.display = 'block';
    lightboxPh.style.display  = 'none';
    lightboxVid.play().catch(() => {});
  } else {
    lightboxVid.src = '';
    lightboxVid.style.display = 'none';
    lightboxPh.style.display  = 'flex';
  }
  lightboxEl.classList.add('open');
}

function closeLightbox() {
  lightboxVid.pause();
  lightboxVid.src = '';
  lightboxEl.classList.remove('open');
}

document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
lightboxEl.addEventListener('click', e => { if (e.target === lightboxEl) closeLightbox(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeLightbox(); closePortfolio(); } });

/* guard mousemove cursor handler when portfolio open */
const _origPortfolioCheck = () => portfolioOpen;


requestAnimationFrame(loop);


/* ── position folders on load ── */
(function () {
  const vw = window.innerWidth, vh = window.innerHeight;
  // Centre-weighted zones for the single folder
  const zones = [
    { x: vw*0.30 + Math.random()*vw*0.30, y: vh*0.32 + Math.random()*vh*0.22 },
    { x: vw*0.25 + Math.random()*vw*0.40, y: vh*0.38 + Math.random()*vh*0.18 },
    { x: vw*0.35 + Math.random()*vw*0.25, y: vh*0.28 + Math.random()*vh*0.28 },
    { x: vw*0.12 + Math.random()*vw*0.25, y: vh*0.30 + Math.random()*vh*0.30 },
    { x: vw*0.55 + Math.random()*vw*0.25, y: vh*0.18 + Math.random()*vh*0.35 },
    { x: vw*0.08 + Math.random()*vw*0.72, y: vh*0.08 + Math.random()*vh*0.18 },
    { x: vw*0.08 + Math.random()*vw*0.55, y: vh*0.66 + Math.random()*vh*0.18 },
  ];
  const z = zones[Math.floor(Math.random() * zones.length)];
  const el = document.querySelector('.folder-overlay');
  if (el) {
    el.style.left = Math.max(8, Math.min(z.x, vw - 110)) + 'px';
    el.style.top  = Math.max(8, Math.min(z.y, vh - 140)) + 'px';
    el.style.display = 'flex';
  }
})();
</script>
